name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build, test & analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A throwaway database on the runner: integration tests need no secret, so
    # they run on every pull request, forks included. The C locale is the
    # strictest setting for text matching.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: price_radar_test
          POSTGRES_USER: price_radar
          POSTGRES_PASSWORD: price_radar
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U price_radar -d price_radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Prepare test database
        run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U price_radar -d price_radar_test -v ON_ERROR_STOP=1
          -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          -c "CREATE EXTENSION IF NOT EXISTS unaccent"

      - name: Database integration tests
        env:
          TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/price_radar_test
          TEST_POSTGRES_USER: price_radar
          TEST_POSTGRES_PASSWORD: price_radar
        run: ./mvnw -B --no-transfer-progress -Pintegration verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: SonarQube analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN not configured; skipping analysis."
            exit 0
          fi
          ./mvnw -B --no-transfer-progress sonar:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"
