spring:
  application:
    name: price-radar-backend

  profiles:
    default: dev

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/price_radar}
    username: ${POSTGRES_USER:price_radar}
    password: ${POSTGRES_PASSWORD:price_radar}
    hikari:
      pool-name: price-radar-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Never let Hibernate touch DDL.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USER:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:price_radar}
    password: ${RABBITMQ_PASSWORD:price_radar}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 4
          multiplier: 2.0
    template:
      mandatory: true

  # TTLs, key prefix and serializers live in com.priceradar.config.CacheConfig
  # so that per-cache TTLs stay next to the cache-name constants.
  cache:
    type: redis

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        # Jackson 3 moved this off SerializationFeature; ISO-8601 over epoch millis.
        write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      enabled: true
    elasticsearch:
      enabled: true
    rabbit:
      enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

# ---------------------------------------------------------------------------
# Application-specific configuration (see com.priceradar.config.*Properties)
# ---------------------------------------------------------------------------
app:
  security:
    jwt:
      # Base64-encoded HMAC-SHA256 secret. MUST be overridden outside dev.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0zMi1ieXRlcyE=}
      issuer: price-radar
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    cors:
      allowed-origins:
        - ${FRONTEND_ORIGIN:http://localhost:3000}
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: ["*"]
      allow-credentials: true
      max-age: 3600

  search:
    index-prefix: price-radar

  messaging:
    exchange: price-radar.events
    dead-letter-exchange: price-radar.dlx
    dead-letter-queue: price-radar.dlq
