spring:
  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false
    clean-disabled: true

  datasource:
    hikari:
      maximum-pool-size: 40
      minimum-idle: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.priceradar: INFO

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
