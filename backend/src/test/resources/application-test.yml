# Connection details come from Testcontainers via @ServiceConnection.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false

app:
  security:
    jwt:
      # Test-only key. 32+ bytes once Base64-decoded.
      secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LXdpdGgtZW5vdWdoLWVudHJvcHktMzJiCg==
      issuer: price-radar-test
      access-token-ttl: 5m
      refresh-token-ttl: 1d

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
