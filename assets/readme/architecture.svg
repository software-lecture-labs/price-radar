<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Price Radar sistem mimarisi</title>
  <desc id="desc">Tarayıcı Next.js frontend'ine (port 3000) bağlanır. Next.js /api/v1 isteklerini Spring Boot backend'ine (port 8080) yönlendirir. Backend Spring Modulith ile modüllere ayrılmıştır: system, identity, platform ve shared çalışır; catalog, merchant, pricing, ingestion, matching, search, alert ve favorites planlanmıştır. Backend PostgreSQL, Redis, Elasticsearch ve Kafka'ya bağlanır.</desc>
  <defs>
    <style>
      .t { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
      .h1 { font-size: 22px; font-weight: 700; fill: #10242C; }
      .sub { font-size: 14px; fill: #5A6E75; }
      .h2 { font-size: 16px; font-weight: 600; fill: #10242C; }
      .h3 { font-size: 14px; font-weight: 600; fill: #10242C; }
      .sm { font-size: 12.5px; fill: #5A6E75; }
      .code { font-size: 12px; fill: #0B7A6C; }
      .plan { fill: #9A5B07; }
      .card { fill: #FFFFFF; stroke: #0B7A6C; stroke-width: 1.5; }
      .chip { fill: #EEF6F4; stroke: #BFD9D3; stroke-width: 1; }
      .planned { fill: #FDF1DC; stroke: #C98A1B; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .tool { fill: #FFFFFF; stroke: #D3DDDA; stroke-width: 1; }
      .wire { fill: none; stroke: #5A6E75; stroke-width: 1.5; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5A6E75"/>
    </marker>
  </defs>

  <rect width="1200" height="820" rx="16" fill="#F3F6F5" stroke="#D3DDDA"/>

  <!-- Header -->
  <text x="40" y="56" class="t h1">Sistem mimarisi</text>
  <text x="40" y="80" class="t sub">Yerel geliştirme düzeni. Oklar istek yönünü gösterir.</text>

  <!-- Legend -->
  <rect x="868" y="44" width="22" height="14" rx="3" class="card"/>
  <text x="898" y="56" class="t sm">çalışıyor</text>
  <rect x="980" y="44" width="22" height="14" rx="3" class="planned"/>
  <text x="1010" y="56" class="t sm">planlanan</text>
  <circle cx="1099" cy="51" r="5" fill="#C98A1B"/>
  <text x="1110" y="56" class="t sm">kısmi</text>

  <!-- Browser -->
  <rect x="40" y="170" width="170" height="96" rx="10" class="card"/>
  <text x="60" y="204" class="t h2">Tarayıcı</text>
  <text x="60" y="228" class="m code">localhost:3000</text>
  <text x="60" y="250" class="t sm">tek köken (same-origin)</text>

  <line x1="210" y1="218" x2="248" y2="218" class="wire" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <rect x="250" y="120" width="300" height="196" rx="12" class="card"/>
  <text x="270" y="152" class="t h2">Next.js 16 · React 19</text>
  <text x="270" y="174" class="m code">frontend · :3000</text>
  <line x1="270" y1="188" x2="530" y2="188" stroke="#D3DDDA"/>
  <text x="270" y="212" class="t sm">App Router · Server Components</text>
  <text x="270" y="236" class="t sm">apiFetch · problem+json → ApiError</text>
  <text x="270" y="260" class="t sm">rewrite /api/v1/* → backend</text>
  <text x="270" y="284" class="t sm">Tailwind CSS 4 · shadcn/ui</text>

  <line x1="550" y1="218" x2="628" y2="218" class="wire" marker-end="url(#arrow)"/>
  <text x="589" y="208" class="m code" text-anchor="middle">/api/v1</text>

  <!-- Backend -->
  <rect x="630" y="120" width="530" height="320" rx="12" class="card"/>
  <text x="650" y="152" class="t h2">Spring Boot 4.1.1 · Java 25</text>
  <text x="650" y="174" class="m code">backend · :8080</text>
  <line x1="650" y1="188" x2="1140" y2="188" stroke="#D3DDDA"/>

  <!-- Application modules (com.priceradar.*) -->
  <rect x="650" y="198" width="156" height="40" rx="8" class="chip"/>
  <text x="662" y="215" class="t h3">system</text>
  <text x="662" y="231" class="t sm">ping · hello</text>
  <rect x="650" y="244" width="156" height="40" rx="8" class="chip"/>
  <text x="662" y="261" class="t h3">identity</text>
  <text x="662" y="277" class="t sm">JWT · güvenlik</text>
  <rect x="650" y="290" width="156" height="40" rx="8" class="chip"/>
  <text x="662" y="307" class="t h3">platform</text>
  <text x="662" y="323" class="t sm">altyapı ayarları</text>
  <rect x="650" y="336" width="156" height="40" rx="8" class="chip"/>
  <text x="662" y="353" class="t h3">shared</text>
  <text x="662" y="369" class="t sm">ortak hata tipleri</text>
  <rect x="817" y="198" width="156" height="40" rx="8" class="planned"/>
  <text x="829" y="215" class="t h3 plan">catalog</text>
  <text x="829" y="231" class="t sm plan">kanonik ürün</text>
  <rect x="817" y="244" width="156" height="40" rx="8" class="planned"/>
  <text x="829" y="261" class="t h3 plan">merchant</text>
  <text x="829" y="277" class="t sm plan">mağaza · kayıt</text>
  <rect x="817" y="290" width="156" height="40" rx="8" class="planned"/>
  <text x="829" y="307" class="t h3 plan">pricing</text>
  <text x="829" y="323" class="t sm plan">fiyat · geçmiş</text>
  <rect x="817" y="336" width="156" height="40" rx="8" class="planned"/>
  <text x="829" y="353" class="t h3 plan">ingestion</text>
  <text x="829" y="369" class="t sm plan">veri toplama</text>
  <rect x="984" y="198" width="156" height="40" rx="8" class="planned"/>
  <text x="996" y="215" class="t h3 plan">matching</text>
  <text x="996" y="231" class="t sm plan">ürün eşleştirme</text>
  <rect x="984" y="244" width="156" height="40" rx="8" class="planned"/>
  <text x="996" y="261" class="t h3 plan">search</text>
  <text x="996" y="277" class="t sm plan">ES indeksi · arama</text>
  <rect x="984" y="290" width="156" height="40" rx="8" class="planned"/>
  <text x="996" y="307" class="t h3 plan">alert</text>
  <text x="996" y="323" class="t sm plan">alarm · bildirim</text>
  <rect x="984" y="336" width="156" height="40" rx="8" class="planned"/>
  <text x="996" y="353" class="t h3 plan">favorites</text>
  <text x="996" y="369" class="t sm plan">takip listesi</text>
  <text x="650" y="406" class="t h3">Spring Modulith 2.1.1 · hexagonal katmanlar</text>
  <text x="650" y="425" class="t sm">sınırlar ve katmanlar testle doğrulanır · olay kaydı: event_publication</text>

  <!-- Bus to data services -->
  <line x1="895" y1="440" x2="895" y2="470" class="wire"/>
  <line x1="171" y1="470" x2="1029" y2="470" class="wire"/>
  <line x1="171" y1="470" x2="171" y2="498" class="wire" marker-end="url(#arrow)"/>
  <line x1="457" y1="470" x2="457" y2="498" class="wire" marker-end="url(#arrow)"/>
  <line x1="743" y1="470" x2="743" y2="498" class="wire" marker-end="url(#arrow)"/>
  <line x1="1029" y1="470" x2="1029" y2="498" class="wire" marker-end="url(#arrow)"/>

  <!-- Data services -->
  <rect x="40" y="500" width="262" height="130" rx="10" class="card"/>
  <text x="60" y="530" class="t h2">PostgreSQL 18.6</text>
  <text x="60" y="554" class="t sm">JPA · Hibernate · Flyway</text>
  <text x="60" y="576" class="m code">:5432 · Flyway V1, V2</text>
  <circle cx="65" cy="603" r="5" fill="#C98A1B"/>
  <text x="78" y="607" class="t sm">bağlı · yalnızca olay tablosu</text>

  <rect x="326" y="500" width="262" height="130" rx="10" class="card"/>
  <text x="346" y="530" class="t h2">Redis 8.10</text>
  <text x="346" y="554" class="t sm">Spring Cache · JSON değerler</text>
  <text x="346" y="576" class="m code">:6379 · price-radar:* önek</text>
  <circle cx="351" cy="603" r="5" fill="#C98A1B"/>
  <text x="364" y="607" class="t sm">bağlı · kullanan servis yok</text>

  <rect x="612" y="500" width="262" height="130" rx="10" class="card"/>
  <text x="632" y="530" class="t h2">Elasticsearch 9.4.5</text>
  <text x="632" y="554" class="t sm">Spring Data Elasticsearch</text>
  <text x="632" y="576" class="m code">:9200 · price-radar-* indeks</text>
  <circle cx="637" cy="603" r="5" fill="#C98A1B"/>
  <text x="650" y="607" class="t sm">bağlı · indeks tanımı yok</text>

  <rect x="898" y="500" width="262" height="130" rx="10" class="card"/>
  <text x="918" y="530" class="t h2">Kafka 4.3.1 · KRaft</text>
  <text x="918" y="554" class="t sm">Spring Kafka · JSON olaylar</text>
  <text x="918" y="576" class="m code">:9092 · .events, .dlt</text>
  <circle cx="923" cy="603" r="5" fill="#C98A1B"/>
  <text x="936" y="607" class="t sm">topic'ler var · tüketici yok</text>

  <!-- Tooling -->
  <text x="40" y="676" class="t h3">Geliştirme ve kalite</text>
  <rect x="40" y="690" width="360" height="90" rx="10" class="tool"/>
  <text x="60" y="718" class="t h3">GitHub Actions</text>
  <text x="60" y="742" class="t sm">backend-ci: mvnw verify + Docker imajı</text>
  <text x="60" y="762" class="t sm">frontend-ci: format, lint, typecheck, build</text>

  <rect x="420" y="690" width="360" height="90" rx="10" class="tool"/>
  <text x="440" y="718" class="t h3">Testcontainers 2.0.5</text>
  <text x="440" y="742" class="t sm">PostgreSQL, Redis, Elasticsearch ve Kafka</text>
  <text x="440" y="762" class="t sm">container'larıyla entegrasyon testi</text>

  <rect x="800" y="690" width="360" height="90" rx="10" class="tool"/>
  <text x="820" y="718" class="t h3">SonarQube 26.9 · JaCoCo 0.8.15</text>
  <text x="820" y="742" class="m code">docker compose --profile quality</text>
  <text x="820" y="762" class="t sm">kapsam raporu: target/site/jacoco</text>
</svg>
